server:
  port: 8080
  servlet:
    context-path: /user-app

# spring-doc
application:
  springdoc:
    title: User Data API
    description: User data.
    version: @project.version@
springdoc:
  show-actuator: true

spring:
  application:
    name: userApp

  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          lob:
            non_contextual_creation: true
          time_zone: UTC
        format_sql: true
    show-sql: true
    generate-ddl: true
    # Hibernate ddl auto (none, create, create-drop, validate, update)
    hibernate:
      ddl-auto: validate
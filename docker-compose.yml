        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/var/log/ojp/heapdump.hprof
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC
      OJP_SERVER_PORT: 1059
      OJP_PROMETHEUS_PORT: 9159
      OJP_SERVER_THREADPOOLSIZE: 200
      OJP_SERVER_LOGLEVEL: DEBUG
      OJP_SERVER_LOG_FILE: /var/log/ojp/server.log
      OJP_SERVER_LOG_MAXHISTORY: 90
      OJP_SERVER_ALLOWEDIPS: "0.0.0.0/0"
      OJP_SERVER_SLOWQUERYSEGREGATION_ENABLED: true
      OJP_SERVER_SLOWQUERYSEGREGATION_SLOWSLOTPERCENTAGE: 10
      OJP_SERVER_SLOWQUERYSEGREGATION_SLOWSLOTTIMEOUT: 180000
      OJP_SERVER_CIRCUITBREAKERTIMEOUT: 60000
      OJP_SERVER_CIRCUITBREAKERTHRESHOLD: 3
    volumes:
      - ojp-logs:/var/log/ojp
      - ./ojp-libs:/opt/ojp/ojp-libs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9159/metrics" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ojp-proxy-3:
    image: rrobetti/ojp:0.4.3-beta
    container_name: ojp-server-3
    restart: unless-stopped
    ports:
      - "1061:1059"
      - "9161:9159"
    environment:
      JAVA_TOOL_OPTIONS: >-
        -Xmx2g
        -Xms512m
        -XX:+UseG1GC
        -XX:MaxGCPauseMillis=200
        -XX:+HeapDumpOnOutOfMemoryError
        -XX:HeapDumpPath=/var/log/ojp/heapdump.hprof
        -Dfile.encoding=UTF-8
        -Duser.timezone=UTC
      OJP_SERVER_PORT: 1059
      OJP_PROMETHEUS_PORT: 9159
      OJP_SERVER_THREADPOOLSIZE: 200
      OJP_SERVER_LOGLEVEL: DEBUG
      OJP_SERVER_LOG_FILE: /var/log/ojp/server.log
      OJP_SERVER_LOG_MAXHISTORY: 90
      OJP_SERVER_ALLOWEDIPS: "0.0.0.0/0"
      OJP_SERVER_SLOWQUERYSEGREGATION_ENABLED: true
      OJP_SERVER_SLOWQUERYSEGREGATION_SLOWSLOTPERCENTAGE: 10
      OJP_SERVER_SLOWQUERYSEGREGATION_SLOWSLOTTIMEOUT: 180000
      OJP_SERVER_CIRCUITBREAKERTIMEOUT: 60000
      OJP_SERVER_CIRCUITBREAKERTHRESHOLD: 3
    volumes:
      - ojp-logs:/var/log/ojp
      - ./ojp-libs:/opt/ojp/ojp-libs
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9159/metrics" ]
      interval: 30s
